<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PostgreSQL 主备单向切换演示</title>
<style>
  :root { --ok:#1a7f37; --warn:#b26a00; --err:#c0392b; --line:#d0d7de; --bg:#f6f8fa; }
  * { box-sizing: border-box; }
  body { font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif; margin:0; background:var(--bg); color:#1f2328; }
  header { background:#0d1117; color:#fff; padding:16px 24px; }
  header h1 { margin:0 0 4px; font-size:20px; }
  header p { margin:0; color:#9da7b3; font-size:13px; }
  main { max-width:1080px; margin:20px auto; padding:0 16px; display:grid; gap:16px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:820px){ .grid2{grid-template-columns:1fr;} }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; }
  .card h2 { margin:0 0 12px; font-size:15px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:#57606a; font-weight:600; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; }
  .badge.primary { background:#dafbe1; color:var(--ok); }
  .badge.standby { background:#ddf4ff; color:#0969da; }
  .badge.unknown { background:#f3f4f6; color:#666; }
  .badge.phase-NORMAL { background:#dafbe1; color:var(--ok); }
  .badge.phase-SWITCH_PENDING,.badge.phase-ROLLBACK { background:#fff8c5; color:var(--warn); }
  .badge.phase-PROMOTED { background:#ddf4ff; color:#0969da; }
  form { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input[type=text],select { padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:14px; flex:1; min-width:160px; }
  button { padding:8px 14px; border:1px solid var(--line); border-radius:6px; background:#f6f8fa; cursor:pointer; font-size:14px; }
  button.primary { background:#1f6feb; border-color:#1f6feb; color:#fff; }
  button.danger { background:#fff; border-color:var(--err); color:var(--err); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #msg { min-height:22px; font-size:13px; margin-top:8px; white-space:pre-wrap; }
  #msg.ok { color:var(--ok); } #msg.warn { color:var(--warn); } #msg.err { color:var(--err); }
  .muted { color:#6e7781; font-size:12px; }
  code { background:#eff1f3; padding:1px 5px; border-radius:4px; }
  .hist-result-SUCCESS { color:var(--ok); font-weight:600; }
  .hist-result-TIMEOUT,.hist-result-FAILED { color:var(--err); font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>PostgreSQL 流复制 · 主备单向切换演示</h1>
  <p>切换受理后新写入返回 503 稍后重试；备库回放完旧主已提交事务后才提升；回放超时自动回滚恢复旧主写入。</p>
</header>
<main>
  <section class="card">
    <h2>集群状态 <span class="muted">（每 2 秒自动刷新）</span></h2>
    <table id="cluster-table"><tbody></tbody></table>
    <div id="msg"></div>
  </section>

  <div class="grid2">
    <section class="card">
      <h2>写入示例记录（只写当前主库）</h2>
      <form id="record-form">
        <input type="text" id="content" placeholder="输入记录内容，如 order-1001" required>
        <button class="primary" type="submit">写入</button>
      </form>
      <p class="muted">切换进行中写入会收到 HTTP 503 + Retry-After。</p>
    </section>

    <section class="card">
      <h2>查询记录</h2>
      <form id="query-form">
        <select id="query-node">
          <option value="">当前写入主库</option>
          <option value="A">节点 A</option>
          <option value="B">节点 B</option>
        </select>
        <button type="submit">查询</button>
      </form>
      <div id="records"></div>
    </section>
  </div>

  <section class="card">
    <h2>单向切换 / 回放控制</h2>
    <form id="switch-form" style="margin-bottom:10px">
      <select id="switch-target">
        <option value="">切到另一节点（单向）</option>
        <option value="A">提升节点 A</option>
        <option value="B">提升节点 B</option>
      </select>
      <input type="text" id="switch-timeout" placeholder="回放等待超时秒数，默认 20">
      <button class="primary" type="submit">发起切换</button>
    </form>
    <form id="replay-form">
      <button class="danger" type="submit" id="pause-btn">暂停备库回放（制造超时）</button>
      <button type="submit" id="resume-btn">恢复备库回放</button>
    </form>
  </section>

  <section class="card">
    <h2>切换历史</h2>
    <table id="history-table">
      <thead><tr><th>#</th><th>开始时间</th><th>旧主→新主</th><th>目标 LSN</th><th>结果</th><th>说明</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
function showMsg(text, cls="") { const m=$("msg"); m.textContent=text; m.className=cls; }
async function api(path, opts={}) {
  const resp = await fetch(path, {headers:{"Content-Type":"application/json"}, ...opts});
  const data = await resp.json().catch(()=>({}));
  if (!resp.ok) {
    const detail = data.detail;
    const msg = typeof detail === "object" && detail ? JSON.stringify(detail) : (detail || resp.statusText);
    const err = new Error(msg); err.status = resp.status; err.data = data; throw err;
  }
  return data;
}
function esc(s){ return String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function refresh() {
  try {
    const s = await api("/api/status");
    const c = s.cluster;
    const rows = [
      ["切换阶段", `<span class="badge phase-${c.phase}">${c.phase}</span>`],
      ["当前写入主库", `<b>${esc(c.leader)}</b>`],
      ["切换目标", esc(c.target ?? "-")],
      ["目标 LSN", `<code>${esc(c.target_lsn ?? "-")}</code> <span class="muted">（已锁定=${c.lsn_finalized ? "是" : "否"}）</span>`],
      ["剩余等待秒数", esc(c.deadline_remaining_seconds ?? "-")],
    ];
    $("cluster-table").querySelector("tbody").innerHTML =
      rows.map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join("")
      + `<tr><th>节点</th><td colspan="5"><table><tbody>${
        s.nodes.map(n=>`<tr>
          <td><b>${esc(n.name)}</b> ${esc(n.host)}:${esc(n.port)}</td>
          <td><span class="badge ${esc(n.role)}">${n.reachable?esc(n.role):"不可达"}</span></td>
          <td>WAL LSN <code>${esc(n.wal_lsn ?? "-")}</code></td>
          <td>回放 LSN <code>${esc(n.replay_lsn ?? "-")}</code></td>
          <td>回放暂停 ${n.replay_paused===null?"-":(n.replay_paused?"是":"否")}</td>
          ${n.read_only!==undefined?`<td>只读=${n.read_only?"是":"否"}</td>`:""}
          ${n.error?`<td class="hist-result-TIMEOUT">${esc(n.error)}</td>`:""}
        </tr>`).join("")
      }</tbody></table></td></tr>`;

    const hist = $("history-table").querySelector("tbody");
    hist.innerHTML = c.history.length ? c.history.slice().reverse().map((h,i)=>`<tr>
      <td>${c.history.length-i}</td><td>${new Date(h.started_at*1000).toLocaleString()}</td>
      <td>${esc(h.old_leader)} → ${esc(h.new_leader)}</td><td><code>${esc(h.target_lsn)}</code></td>
      <td class="hist-result-${esc(h.result)}">${esc(h.result)}</td><td>${esc(h.message)}</td>
    </tr>`).join("") : `<tr><td colspan="6" class="muted">暂无切换记录</td></tr>`;
  } catch (e) {
    showMsg("状态刷新失败：" + e.message, "err");
  }
}

$("record-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  try {
    const r = await api("/api/records", {method:"POST", body:JSON.stringify({content:$("content").value})});
    showMsg(`写入成功：id=${r.id}，由节点 ${r.node} 落盘`, "ok");
    $("content").value="";
    refresh();
  } catch (e) {
    showMsg(e.status===503 ? `写入被拒（${e.status}）：${e.message}\n请稍后重试，切换完成后会恢复写入` : `写入失败：${e.message}`, e.status===503?"warn":"err");
  }
});

$("query-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const node = $("query-node").value;
  try {
    const r = await api("/api/records" + (node?`?node=${node}`:""));
    $("records").innerHTML = `<p class="muted">节点 ${esc(r.node)}，共 ${r.count} 条（最新在前）</p>` +
      `<table><thead><tr><th>ID</th><th>内容</th><th>写入节点</th><th>时间</th></tr></thead><tbody>` +
      r.records.map(x=>`<tr><td>${x.id}</td><td>${esc(x.content)}</td><td>${esc(x.written_by)}</td><td>${esc(x.created_at)}</td></tr>`).join("")
      + "</tbody></table>";
  } catch (e) { showMsg("查询失败：" + e.message, "err"); }
});

$("switch-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const body = {};
  if ($("switch-target").value) body.target = $("switch-target").value;
  if ($("switch-timeout").value) body.timeout = Number($("switch-timeout").value);
  try {
    const r = await api("/api/switch", {method:"POST", body:JSON.stringify(body)});
    showMsg(r.message, "warn");
  } catch (e) { showMsg("切换被拒：" + e.message, "err"); }
  refresh();
});

$("replay-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const isPause = ev.submitter && ev.submitter.id === "pause-btn";
  try {
    const r = await api(isPause ? "/api/replay/pause" : "/api/replay/resume", {method:"POST", body:"{}"});
    showMsg(`节点 ${r.node} 回放已${r.replay_paused?"暂停（切换将在超时后回滚）":"恢复，重新发起切换即可成功"}`, r.replay_paused?"warn":"ok");
  } catch (e) { showMsg("回放控制失败：" + e.message, "err"); }
  refresh();
});

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
